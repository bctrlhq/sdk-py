# Publishes bctrl to PyPI when a GitHub release is published for a tag matching bctrl/_version.py (v3.0.0 for
# 3.0.0). PyPI trusted publishing authenticates this workflow through GitHub OIDC: no token is stored. Re-run it from
# the Actions tab if a publish failed.
name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install . build twine pytest
      - name: Verify the release tag
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import bctrl; print(bctrl.__version__)')"
      - name: Test the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
