name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The oldest supported Python, so newer syntax cannot slip in.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install . build pytest pyright mypy
      - name: Test the installed package
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests"
      - run: pyright
      - run: mypy
      - run: python -m build
