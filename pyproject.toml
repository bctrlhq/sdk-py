[project]
name = "bctrl"
dynamic = ["version"]
description = "The official Python library for the BCTRL API"
readme = "README.md"
license = "ISC"
requires-python = ">=3.10"
authors = [
    { name = "bctrl" }
]
keywords = ["browser", "automation", "ai", "puppeteer", "playwright", "selenium", "web", "scraping"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "typing-extensions>=4.1.0",
    "httpx>=0.21.2,<1",
    "pydantic>=1.9.2,<3",
]

[dependency-groups]
dev = ["pytest", "pyright", "mypy"]

[project.urls]
Homepage = "https://github.com/bctrlhq/sdk-py"
Documentation = "https://github.com/bctrlhq/sdk-py#readme"
Repository = "https://github.com/bctrlhq/sdk-py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bctrl/_version.py"

[tool.hatch.build.targets.sdist]
include = ["bctrl", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["bctrl"]
# Fern's own tests and docs target its standalone layout, not this package.
exclude = ["bctrl/_generated/tests", "bctrl/_generated/*.md", "bctrl/_generated/.fern", "bctrl/generated_clients.manifest.json"]

# Pyright reports on the hand-written code; Fern's pydantic v1/v2 compatibility layer is checked by mypy.
[tool.pyright]
include = ["bctrl"]
exclude = ["bctrl/_generated"]
pythonVersion = "3.10"

[tool.mypy]
packages = ["bctrl"]
exclude = ["bctrl/_generated/tests/"]
python_version = "3.10"
